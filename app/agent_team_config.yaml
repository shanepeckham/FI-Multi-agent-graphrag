    - CRITICAL: Your response must be valid JSON in the ClassificationResult format shown above. Do not include any additional text, explanations, or formatting outside the JSON structure.
    - All elements of the JSON MUST be in English, even the individual arguments, for example "origin", "details" etc..
    - Each action should be a separate object in the actions array.
    - The action_name should match one of the available actions or be 'Unknown' if no clear action is identified.
    - The metadata should provide context, parameters, or details about the action.
